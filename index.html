
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de productos - TecnoStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<script>
// Esperar a que el formulario esté cargado
document.addEventListener('DOMContentLoaded', function() {
    const formulario = document.querySelector('form');
    
    formulario.addEventListener('submit', function(evento) {
        const codigo = document.getElementById('codigo').value;
        
        // Validar que el código no tenga espacios
        if (codigo.includes(' ')) {
            evento.preventDefault(); // Detener el envío
            alert('El código no puede contener espacios.');
            return false;
        }
        
        // Validar que el precio no sea cero
        const precio = document.getElementById('precio').value;
        if (parseFloat(precio) <= 0) {
            evento.preventDefault();
            alert('El precio debe ser mayor a cero.');
            return false;
        }
    });
});

// Validar el código mientras el usuario escribe
const campoCodigo = document.getElementById('codigo');
campoCodigo.addEventListener('input', function() {
    const valor = this.value;
    
    // Si contiene espacios, mostrar mensaje de error
    if (valor.includes(' ')) {
        this.setCustomValidity('El código no puede contener espacios');
        this.style.borderColor = 'red';
    } else {
        this.setCustomValidity('');
        this.style.borderColor = '';
    }
});

</script>

<body class="bg-light">

    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 760px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Registrar producto</h1>
                <p class="text-secondary">Complete los datos obligatorios.</p>

                <form action="guardar_producto.php" method="post">
                    <div class="row g-3">
                        
                        <!-- Código -->
                        <div class="col-md-4">
                            <label for="codigo" class="form-label">Código</label>
                            <input type="text" class="form-control" id="codigo" name="codigo" 
                                   maxlength="20" pattern="[A-Za-z0-9-]+" placeholder="TEC-001" required>
                        </div>

                        <!-- Nombre -->
                        <div class="col-md-8">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" 
                                   minlength="3" maxlength="100" required>
                        </div>

                        <!-- Categoría -->
                        <div class="col-md-6">
                            <label for="categoria_id" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria_id" name="categoria_id" required>
                                <option value="">Seleccione...</option>
                                <option value="1">Accesorios</option>
                                <option value="2">Almacenamiento</option>
                                <option value="3">Conectividad</option>
                                <option value="4">Periféricos</option>
                                <option value="5">Audio</option>
                            </select>
                        </div>

                        <!-- Precio -->
                        <div class="col-md-6">
                            <label for="precio" class="form-label">Precio</label>
                            <input type="number" class="form-control" id="precio" name="precio" 
                                   min="0" step="0.01" required>
                        </div>

                        <!-- Stock actual -->
                        <div class="col-md-6">
                            <label for="stock_actual" class="form-label">Stock actual</label>
                            <input type="number" class="form-control" id="stock_actual" name="stock_actual" 
                                   min="0" step="1" required>
                        </div>

                        <!-- Stock mínimo -->
                        <div class="col-md-6">
                            <label for="stock_minimo" class="form-label">Stock mínimo</label>
                            <input type="number" class="form-control" id="stock_minimo" name="stock_minimo" 
                                   min="0" step="1" required>
                        </div>

                        <!-- Descripción -->
                        <div class="col-12">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" maxlength="255"></textarea>
                        </div>

                        <!-- Botones -->
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Guardar producto</button>
                            <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
