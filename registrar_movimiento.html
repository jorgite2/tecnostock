
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar movimiento - TecnoStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="estilos.css" rel="stylesheet">
</head>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const formulario = document.querySelector('form');
    
    formulario.addEventListener('submit', function(evento) {
        const cantidad = document.getElementById('cantidad').value;
        const tipo = document.querySelector('input[name="tipo"]:checked');
        
        // Validar que se haya seleccionado un tipo
        if (!tipo) {
            evento.preventDefault();
            alert('Debe seleccionar el tipo de movimiento (entrada o salida).');
            return false;
        }
        
        // Validar que la cantidad sea un número entero positivo
        if (!cantidad || parseInt(cantidad) <= 0) {
            evento.preventDefault();
            alert('La cantidad debe ser un número entero mayor a cero.');
            return false;
        }
        
        // Validar que no sea un número decimal
        if (cantidad.includes('.')) {
            evento.preventDefault();
            alert('La cantidad debe ser un número entero (sin decimales).');
            return false;
        }
    });
});
</script>

<body class="bg-light">

    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Registrar movimiento de inventario</h1>
                <p class="text-secondary">Seleccione el tipo de movimiento y complete los datos.</p>

                <form action="procesar_movimiento.php" method="post">
                    <div class="row g-3">
                        
                        <!-- Tipo de movimiento -->
                        <div class="col-12">
                            <label class="form-label">Tipo de movimiento</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="tipo" id="tipo_entrada" value="entrada" required>
                                    <label class="form-check-label" for="tipo_entrada">
                                        Entrada (ingreso de mercadería)
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="tipo" id="tipo_salida" value="salida" required>
                                    <label class="form-check-label" for="tipo_salida">
                                        Salida (despacho o venta)
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Producto -->
                        <div class="col-12">
                            <label for="producto_id" class="form-label">Producto</label>
                            <select class="form-select" id="producto_id" name="producto_id" required>
                                <option value="">Seleccione un producto...</option>
                                <option value="1">TEC-001 - Cable HDMI 2m</option>
                                <option value="2">TEC-002 - Pendrive 32GB</option>
                                <option value="3">TEC-003 - Mouse inalámbrico</option>
                                <option value="4">TEC-004 - Teclado mecánico</option>
                                <option value="5">TEC-005 - Router WiFi 6</option>
                                <option value="6">TEC-006 - Audífonos Bluetooth</option>
                                <option value="7">TEC-007 - Cargador USB-C</option>
                                <option value="8">TEC-008 - Disco SSD 480GB</option>
                                <option value="9">TEC-009 - Switch 8 puertos</option>
                                <option value="10">TEC-010 - Funda laptop 15"</option>
                            </select>
                        </div>

                        <!-- Cantidad -->
                        <div class="col-12">
                            <label for="cantidad" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="cantidad" name="cantidad" 
                                   min="1" step="1" required>
                            <small class="text-muted">Ingrese un número entero mayor a cero.</small>
                        </div>

                        <!-- Observación -->
                        <div class="col-12">
                            <label for="observacion" class="form-label">Observación (opcional)</label>
                            <textarea class="form-control" id="observacion" name="observacion" 
                                      rows="3" maxlength="255" placeholder="Ej: Venta a cliente, Reposición de stock, etc."></textarea>
                        </div>

                        <!-- ID Usuario (oculto, simulado) -->
                        <input type="hidden" name="usuario_id" value="1">

                        <!-- Botones -->
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Registrar movimiento</button>
                            <a href="listar_productos.php" class="btn btn-outline-secondary">Cancelar</a>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
